name: Validate RaceDay Repository

on:
  push:
  pull_request:

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Show repository files
      run: |
        echo "Checking repository structure..."
        ls -R

    - name: Check required folders and files
      run: |
        test -d docs
        test -f docs/RaceDay_ERD.png
        test -f docs/Section_A_B_Planning_Document.pdf
        test -f docs/RaceDayDatabase.sql

        echo "All required RaceDay files are present"
